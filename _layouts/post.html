---
layout: default
---
<article class="post text">
    <header>
        <time class="date" datetime="{{ page.date | date_to_xmlschema }}">{{ page.date | date: "%b %-d, %Y" }}</time>
        <h1 class="post-title">{{ page.title }}</h1>
    </header>

    <div class="post-content">
        {{ content | image_rows }}
    </div>

    <footer class="post-footer">
        {% if page.tags.size > 0 %}
            <div class="tags">
                {% for tag in page.tags %}<a href="#">{{ tag | prepend: "#" }}</a> {% endfor %}
            </div>
        {% endif %}

        <div class="post-controls">
            <span class="post-meta">Back to <a href="{{ '/' | relative_url }}">home</a></span>
        </div>
    </footer>
</article>
